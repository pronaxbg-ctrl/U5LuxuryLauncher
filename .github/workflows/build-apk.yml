name: Build & Publish U5 Luxury Launcher APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare Release Files
        run: |
          cp app/build/outputs/apk/release/app-release.apk U5LuxuryLauncher.apk
          VERSION_CODE=$(grep -E "versionCode\s*=" app/build.gradle.kts | head -n1 | tr -dc '0-9')
          VERSION_NAME=$(grep -E "versionName\s*=" app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "{\"versionCode\": ${VERSION_CODE}, \"versionName\": \"${VERSION_NAME}\"}" > version.json
          cat version.json

      - name: Publish to GitHub Release (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest U5LuxuryLauncher.apk version.json --clobber
          else
            gh release create latest U5LuxuryLauncher.apk version.json --title "U5 Luxury Launcher (Latest)" --notes "Auto-built signed APK for 1-tap in-app updates."
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: U5LuxuryLauncher-APK
          path: U5LuxuryLauncher.apk
